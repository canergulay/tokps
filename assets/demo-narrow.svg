<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 388" width="554" height="388" role="img" aria-label="Terminal: tokps comparing deepseek-chat, deepseek-flash and deepseek-v4-pro — TTFT, time to first answer and TPS per model.">
<style>
@font-face{font-family:"tk-sans";src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"tk-term";src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"tk-term-b";src:url(data:font/woff2;base64,) format("woff2")}
  text { font-family: tk-term, ui-monospace, monospace; font-size: 15px; }
  .cover { opacity: 0; }
  @keyframes type0 { from { opacity: 1; transform: translateX(0); } to { opacity: 1; transform: translateX(93px); } }
@keyframes type1 { from { opacity: 1; transform: translateX(0); } to { opacity: 1; transform: translateX(489px); } }
@keyframes type2 { from { opacity: 1; transform: translateX(0); } to { opacity: 1; transform: translateX(498px); } }
@keyframes type3 { from { opacity: 1; transform: translateX(0); } to { opacity: 1; transform: translateX(489px); } }
  .ln { animation: show .35s ease-out backwards; }
  @keyframes show { from { opacity: 0; } }
  .cur { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cover { display: none; } .ln { opacity: 1; animation: none; } }
</style>
